apiVersion: apps/v1
kind: Deployment
metadata:
  name: signaling
  namespace: callservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signaling
  template:
    metadata:
      labels:
        app: signaling
    spec:
      containers:
        - name: signaling
          image: callservice/signaling:latest
          ports:
            - containerPort: 8081
            - containerPort: 9091
          envFrom:
            - configMapRef:
                name: callservice-config
            - secretRef:
                name: callservice-secrets
          env:
            - name: HTTP_PORT
              value: "8081"
            - name: METRICS_PORT
              value: "9091"
            - name: ROOM_GRPC_ADDR
              value: rooms:8080
            - name: SERVICE_NAME
              value: signaling
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SFU_ENABLED
              value: "true"
            - name: SFU_PUBLIC_URL
              value: "wss://calls.example/sfu/v1/ws"
            - name: REDIS_HOST
              value: redis
            - name: KAFKA_BROKERS
              value: kafka:9092
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: signaling
  namespace: callservice
spec:
  selector:
    app: signaling
  ports:
    - port: 8081
      targetPort: 8081
