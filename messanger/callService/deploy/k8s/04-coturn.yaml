apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: callservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      hostNetwork: true
      containers:
        - name: coturn
          image: coturn/coturn:4.6.3
          args:
            - "-n"
            - "--log-file=stdout"
            - "--listening-port=3478"
            - "--tls-listening-port=5349"
            - "--fingerprint"
            - "--use-auth-secret"
            - "--static-auth-secret=$(TURN_SHARED_SECRET)"
            - "--realm=calls.example"
            - "--external-ip=$(WEBRTC_TURN_EXTERNAL_IP)"
            - "--min-port=49160"
            - "--max-port=49200"
          env:
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: callservice-secrets
                  key: TURN_SHARED_SECRET
            - name: WEBRTC_TURN_EXTERNAL_IP
              value: "CHANGE_ME_PUBLIC_IP"
---
# TLS for WSS is expected on an external nginx / Ingress controller.
# Point nginx upstreams at signaling:8081 and sfu hostNetwork :8082.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-notes
  namespace: callservice
data:
  README: |
    Use deploy/nginx/callService.conf.example on the edge node.
    Do not expose rooms:8080 or */metrics publicly.
