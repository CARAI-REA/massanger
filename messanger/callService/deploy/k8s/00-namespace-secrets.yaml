apiVersion: v1
kind: Namespace
metadata:
  name: callservice
---
apiVersion: v1
kind: Secret
metadata:
  name: callservice-secrets
  namespace: callservice
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME"
  JOIN_TOKEN_SECRET_KEY: "CHANGE_ME"
  SERVICE_JWT_SECRET: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  TURN_SHARED_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: callservice-config
  namespace: callservice
data:
  APP_ENV: "production"
  JOIN_TOKEN_EXPIRATION: "15m"
  WS_ALLOW_QUERY_TOKEN: "false"
  WS_ALLOWED_ORIGINS: "https://app.example"
  POSTGRES_SSL_MODE: "require"
  GRPC_MAX_RPS: "100"
  WEBRTC_NAT_1TO1_CANDIDATE_TYPE: "host"
