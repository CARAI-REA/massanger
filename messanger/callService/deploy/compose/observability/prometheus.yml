global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rooms
    metrics_path: /metrics
    static_configs:
      - targets: ["rooms:9090"]
        labels:
          service: rooms

  - job_name: signaling
    metrics_path: /metrics
    static_configs:
      - targets: ["signaling:9091"]
        labels:
          service: signaling

  - job_name: sfu
    metrics_path: /metrics
    static_configs:
      - targets: ["sfu:9093"]
        labels:
          service: sfu
