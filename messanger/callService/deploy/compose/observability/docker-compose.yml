# Prometheus + Grafana for callService local metrics
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: callservice-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_EXTERNAL_PORT:-9095}:9090"
    networks:
      - rooms-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: callservice-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_EXTERNAL_PORT:-3000}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana-dashboard.json:/var/lib/grafana/dashboards/callservice.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_EXTERNAL_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - rooms-net
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  rooms-net:
    name: rooms-net
    external: true
