services:
  postgres-rooms:
    image: postgres:17.0-alpine3.20
    container_name: postgres-rooms
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_rooms_data:/var/lib/postgresql/data
    ports:
      - "${EXTERNAL_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rooms-net

  rooms:
    build:
      context: ../../..
      dockerfile: deploy/docker/Dockerfile
    container_name: rooms
    env_file:
      - .env
    environment:
      # Внутри docker-сети хосты инфраструктуры — имена контейнеров
      GRPC_HOST: 0.0.0.0
      POSTGRES_HOST: postgres-rooms
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
      MIGRATION_DIRECTORY: ./internal/migrations
    ports:
      - "${GRPC_PORT}:${GRPC_PORT}"
      - "${METRICS_PORT}:${METRICS_PORT}"
    depends_on:
      postgres-rooms:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/grpc-health-probe", "-addr=:${GRPC_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - rooms-net

volumes:
  postgres_rooms_data:

networks:
  rooms-net:
    external: true
