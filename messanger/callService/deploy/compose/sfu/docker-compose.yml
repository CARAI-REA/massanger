services:
  coturn:
    image: coturn/coturn:4.6.3
    container_name: sfu-coturn
    restart: unless-stopped
    networks:
      - rooms-net
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    environment:
      DETECT_EXTERNAL_IP: "yes"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-ip=0.0.0.0"
      - "--listening-port=3478"
      - "--fingerprint"
      # Local/dev: static user. Production: prefer --use-auth-secret + TURN_SHARED_SECRET (HMAC).
      - "--lt-cred-mech"
      - "--user=${WEBRTC_TURN_USERNAME:-sfu}:${WEBRTC_TURN_CREDENTIAL:-sfu-turn-secret}"
      - "--realm=sfu.local"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--external-ip=${WEBRTC_TURN_EXTERNAL_IP:-127.0.0.1}"

  sfu:
    build:
      context: ../../..
      dockerfile: deploy/docker/Dockerfile.sfu
    container_name: sfu
    env_file:
      - .env
    depends_on:
      - coturn
    environment:
      HTTP_HOST: 0.0.0.0
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
      ROOM_GRPC_ADDR: rooms:8080
      PUBLIC_WS_URL: ws://localhost:8082/v1/ws
      WEBRTC_NAT_1TO1_IPS: ${WEBRTC_NAT_1TO1_IPS:-}
      WEBRTC_NAT_1TO1_CANDIDATE_TYPE: ${WEBRTC_NAT_1TO1_CANDIDATE_TYPE:-host}
      # Inside compose: reach coturn by service name. Browsers get CLIENT override (localhost).
      WEBRTC_ICE_SERVERS: ${WEBRTC_ICE_SERVERS:-stun:stun.l.google.com:19302,turn:coturn:3478?transport=udp}
      WEBRTC_CLIENT_ICE_SERVERS: ${WEBRTC_CLIENT_ICE_SERVERS:-stun:stun.l.google.com:19302,turn:localhost:3478?transport=udp}
      WEBRTC_TURN_USERNAME: ${WEBRTC_TURN_USERNAME:-sfu}
      WEBRTC_TURN_CREDENTIAL: ${WEBRTC_TURN_CREDENTIAL:-sfu-turn-secret}
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
      - "${METRICS_PORT}:${METRICS_PORT}"
      - "10000-10100:10000-10100/udp"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${HTTP_PORT}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - rooms-net

networks:
  rooms-net:
    external: true
