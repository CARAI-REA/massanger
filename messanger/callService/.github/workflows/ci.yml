name: callService CI

on:
  push:
    paths:
      - 'messanger/callService/**'
  pull_request:
    paths:
      - 'messanger/callService/**'

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: messanger/callService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Test rooms
        run: cd rooms && go test ./... -count=1 -short
      - name: Test signaling
        run: cd signaling && go test ./... -count=1 -short
      - name: Test sfu
        run: cd sfu && go test ./... -count=1 -short
      - name: Test platform
        run: cd platform && go test ./... -count=1

  # Full Docker e2e is optional / nightly — needs compose stack.
